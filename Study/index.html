<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách sản phẩm</title>
  <style>
    /* Thiết lập cơ bản */
    * {
      box-sizing: border-box;
      font-family: 'Times New Roman', Times, serif; /* Font chữ có chân giống hệt ảnh mẫu */
    }

    body {
      display: flex;
      justify-content: center;
      padding: 20px;
      background-color: #f9f9f9;
    }

    /* Container xếp các card theo chiều dọc */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 250px;
    }

    /* Cấu trúc Card sản phẩm */
    .product-card {
      width: 250px;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #e5e5e5;
      background-color: #f2f2f2; /* Màu nền xám nhạt mặc định */
      
      display: flex;
      flex-direction: column;
      position: relative; /* Mỏ neo cho nhãn "MỚI" ::before */
      transition: all 0.2s ease;
      overflow: hidden; /* Giữ phần viền đẹp khi chứa ảnh */
    }

    /* Hình ảnh sản phẩm */
    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      margin-bottom: 15px;
      background-color: #fff;
    }

    /* Tên sản phẩm */
    .product-name {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: #000;
    }

    /* Giá sản phẩm */
    .product-price {
      font-size: 15px;
      color: #8b0000; /* Màu đỏ đô giống ảnh mẫu */
      margin: 0;
    }

    /* Tạo nhãn "MỚI" đè ở góc trên bên trái bằng ::before */
    .product-card::before {
      content: "MỚI";
      position: absolute;
      top: 0;
      left: 0;
      background-color: #cc0000;
      color: #ffffff;
      font-size: 13px;
      font-weight: bold;
      padding: 3px 8px;
      z-index: 10;
    }

    /* Hiệu ứng khi rê chuột (Hover) */
    .product-card:hover {
      border-color: #0056b3;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    /* Dùng :nth-child(even) để đổi màu nền so le cho card vị trí chẵn (Bàn phím cơ) */
    .product-card:nth-child(even) {
      background-color: #a4b8c9; /* Màu xanh xám đúng theo ảnh */
    }
  </style>
</head>
<body>

  <div class="product-list">
    <!-- Card 1 -->
    <div class="product-card">
      <img src="https://cf.shopee.vn/file/sg-11134201-22100-tyb9vvkk66iva2" alt="Tai nghe Bluetooth" class="product-img">
      <h3 class="product-name">Tai nghe Bluetooth</h3>
      <p class="product-price">299.000đ</p>
    </div>

    <!-- Card 2 (Vị trí chẵn - tự đổi màu nền) -->
    <div class="product-card">
      <img src="https://th.bing.com/th/id/R.38582c1c438e4b4e1684760e35b4ab00?rik=GbMSOxWw7Bkhug&pid=ImgRaw&r=0" alt="Bàn phím cơ" class="product-img">
      <h3 class="product-name">Bàn phím cơ</h3>
      <p class="product-price">890.000đ</p>
    </div>

    <!-- Card 3 -->
    <div class="product-card">
      <img src="https://cdnv2.tgdd.vn/mwg-static/tgdd/Products/Images/86/233296/chuot-khong-day-silent-logitech-m331-070125-014541-867-600x600.jpg" alt="Chuột không dây" class="product-img">
      <h3 class="product-name">Chuột không dây</h3>
      <p class="product-price">199.000đ</p>
    </div>
  </div>

</body>
</html>
